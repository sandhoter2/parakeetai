services:
  - type: web
    name: parakeetai
    runtime: docker
    buildCommand: "./build.sh"
    startCommand: "gunicorn local_parakeet.wsgi:application"
    envVars:
      - key: MONGODB_URI
        sync: false          # Set this in the Render dashboard: your Atlas connection string
      - key: MONGODB_DB_NAME
        value: "parakeetai"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: EXT_TOKEN
        value: "pkai-local-dev"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_WHISPER_MODEL
        value: "whisper-large-v3-turbo"
      - key: PYTHON_VERSION
        value: "3.11.0"

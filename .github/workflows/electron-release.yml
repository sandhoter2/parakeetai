name: Build & Release Electron Overlay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: parakeetai-electron-overlay/package-lock.json

      - name: Install dependencies
        working-directory: parakeetai-electron-overlay
        run: npm ci

      - name: Build macOS DMG
        working-directory: parakeetai-electron-overlay
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: parakeetai-electron-overlay/dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: parakeetai-electron-overlay/package-lock.json

      - name: Install dependencies
        working-directory: parakeetai-electron-overlay
        run: npm ci

      - name: Build Windows installer
        working-directory: parakeetai-electron-overlay
        run: npm run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            parakeetai-electron-overlay/dist/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ParakeetAI Overlay ${{ github.ref_name || inputs.version }}
          body: |
            ## ParakeetAI Overlay — Desktop App

            A transparent, always-on-top overlay that surfaces AI answers during interviews.

            ### Install

            **macOS:** Download the `.dmg`, open it, drag ParakeetAI to Applications.
            **Windows:** Download `ParakeetAI-Setup-*.exe` and run the installer.

            ### What's included
            - Transparent overlay panel (undetectable by screen-share)
            - Real-time AI answers from your interview session
            - Mic + system audio capture
            - Keyboard shortcuts to show/hide instantly
          files: |
            dist-artifacts/mac-dmg/*.dmg
            dist-artifacts/windows-exe/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

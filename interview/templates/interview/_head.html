{# Shared <head> block: fonts, favicon, theme bootstrap. Included by every page. #}
<meta name="theme-color" content="#14131F">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23FFC83D' d='M22 5h20c9.4 0 17 7.6 17 17v11c0 9.4-7.6 17-17 17H31.5L18.2 59.6c-1.7 1.2-4-.2-3.7-2.3l1.2-9.1C9.4 45.4 5 39.7 5 33V22C5 12.6 12.6 5 22 5z'/%3E%3Crect x='20.5' y='16.5' width='6' height='11.5' rx='3' fill='%2317152E'/%3E%3Cpath d='M36 23.5c2-3 5.5-3 7.5 0M20.5 33.5c2.8 4.6 7 7 11.5 7s8.7-2.4 11.5-7' fill='none' stroke='%2317152E' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<script>
  /* Resolve the theme before first paint: saved choice, then account setting, then OS preference. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('pkai_theme'); } catch (e) {}
    var account = "{% if request.user.is_authenticated %}{{ request.user.profile.theme|default:'' }}{% endif %}";
    var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', saved || account || system);
  })();
</script>

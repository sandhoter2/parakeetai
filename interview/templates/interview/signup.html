<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — HappyHelper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #252836;
      --border: #2e3147;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1.6;
    }
    .wrap { width: 100%; max-width: 420px; padding: 24px; }
    .brand { text-align: center; margin-bottom: 36px; }
    .brand-logo { font-size: 48px; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(108,99,255,0.5)); }
    .brand-name {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .brand-sub { font-size: 13px; color: var(--text3); margin-top: 4px; }
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.4);
    }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; color: var(--text2);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-control {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
    .form-control::placeholder { color: var(--text3); }
    .error-box {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px; padding: 10px 14px; color: var(--red);
      font-size: 13px; margin-bottom: 18px; white-space: pre-line;
    }
    .hint-text { font-size: 11px; color: var(--text3); margin-top: 5px; }
    .btn-signup {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, var(--green), #059669);
      color: #fff; border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 4px;
    }
    .btn-signup:hover { box-shadow: 0 4px 16px rgba(52,211,153,0.35); transform: translateY(-1px); }
    .btn-signup:active { transform: translateY(0); }
    .divider { height: 1px; background: var(--border); margin: 24px 0; }
    .hint { text-align: center; font-size: 12px; color: var(--text3); }
    .hint a { color: var(--accent2); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">😊</span>
      <div class="brand-name">HappyHelper</div>
      <div class="brand-sub">Create your private workspace</div>
    </div>

    <div class="card">
      <div class="card-title">Create account</div>
      <div class="card-sub">Your sessions and data are private to you</div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input type="text" id="id_username" name="username" class="form-control"
                 placeholder="Choose a username" autocomplete="username" autofocus
                 value="{{ form.data.username|default:'' }}">
        </div>

        <div class="form-group">
          <label for="id_password1">Password</label>
          <input type="password" id="id_password1" name="password1" class="form-control"
                 placeholder="Create a strong password" autocomplete="new-password">
          <div class="hint-text">Min 8 characters, not entirely numeric</div>
        </div>

        <div class="form-group">
          <label for="id_password2">Confirm Password</label>
          <input type="password" id="id_password2" name="password2" class="form-control"
                 placeholder="Repeat your password" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-signup">Create Account</button>
      </form>

      <div class="divider"></div>
      <div class="hint">Already have an account? <a href="/login/">Sign in</a></div>
    </div>
  </div>
</body>
</html>

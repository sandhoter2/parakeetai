<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ParakeetAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f18;
      --bg2: #161927;
      --bg3: #1f2235;
      --border: #252840;
      --accent: #7c6fff;
      --accent2: #b09eff;
      --green: #34d399;
      --red: #f87171;
      --text: #eef0f8;
      --text2: #8b93b8;
      --text3: #565e82;
      --radius: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }
    /* Background mesh gradient */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,111,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(176,158,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(52,211,153,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    /* Subtle dot grid */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-mark-wrap {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .brand-mark {
      width: 60px; height: 60px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), #5a4fd8);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 32px rgba(124,111,255,0.35);
    }
    .brand-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--text3);
      margin-top: 5px;
    }

    .card {
      background: rgba(22,25,39,0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,111,255,0.06) inset;
      backdrop-filter: blur(12px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .card-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .form-control {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,111,255,0.15);
    }
    .form-control::placeholder { color: var(--text3); }

    .error-box {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 9px;
      padding: 10px 14px;
      color: var(--red);
      font-size: 13px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #5a4fd8);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
      letter-spacing: -0.1px;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(124,111,255,0.3);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #8d82ff, var(--accent));
      box-shadow: 0 6px 24px rgba(124,111,255,0.45);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); box-shadow: none; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--text3);
    }
    .hint a { color: var(--accent2); font-weight: 500; }
    .hint a:hover { text-decoration: underline; }

    .features {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .feature {
      background: rgba(22,25,39,0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .feature-icon { font-size: 20px; margin-bottom: 5px; }
    .feature-label { font-size: 12px; color: var(--text2); font-weight: 500; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark-wrap">
        <div class="brand-mark">🦜</div>
      </div>
      <div class="brand-name">ParakeetAI</div>
      <div class="brand-sub">Your AI assistant for interviews &amp; meetings</div>
    </div>

    <div class="card">
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to access your sessions</div>

      {% if error %}
      <div class="error-box">
        <span>⚠</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            autofocus
            value="{{ form.data.username|default:'' }}"
          >
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="divider"></div>
      <div class="hint">
        Don't have an account? <a href="/signup/">Sign up</a>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎙️</div>
        <div class="feature-label">Live transcription</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-label">AI coaching</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🗺️</div>
        <div class="feature-label">Conversation blueprint</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <div class="feature-label">Private & local</div>
      </div>
    </div>
  </div>
</body>
</html>

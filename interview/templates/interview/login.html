{% extends "interview/auth_base.html" %}
{% block title %}Sign in — HappyHelper{% endblock %}

{% block form %}
<h1>Sign in</h1>
<p class="sub">Welcome back. Your sessions are where you left them.</p>

{% if error %}
<div class="error-box" role="alert">{{ error }}</div>
{% endif %}

<form method="post">
  {% csrf_token %}

  <div class="form-group">
    <label for="id_username">Username</label>
    <input type="text" id="id_username" name="username" class="form-control"
           autocomplete="username" autofocus value="{{ form.data.username|default:'' }}">
  </div>

  <div class="form-group">
    <label for="id_password">Password</label>
    <input type="password" id="id_password" name="password" class="form-control"
           autocomplete="current-password">
  </div>

  <button type="submit" class="btn btn-primary">Sign in</button>
</form>

<p class="auth-alt">New here? <a href="/signup/">Create an account</a></p>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PARAKEETAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #040b10;
      --bg2: #0a141c;
      --bg3: #111d27;
      --border: #1a2d3d;
      --accent: #00c8ff;
      --accent2: #6c63ff;
      --green: #00ff9d;
      --red: #ff4757;
      --yellow: #ffd32a;
      --text: #e0f2ff;
      --text2: #7ab0cc;
      --text3: #3d6880;
      --mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }
    /* Robot dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(0,200,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }
    /* Cyan accent glow */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 15% 15%, rgba(0,200,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 85% 85%, rgba(108,99,255,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-mark-wrap {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .brand-mark {
      width: 60px; height: 60px; border-radius: 4px;
      background: rgba(0,200,255,0.08);
      border: 1px solid rgba(0,200,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 24px rgba(0,200,255,0.2), 0 0 48px rgba(0,200,255,0.08);
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: var(--mono);
      color: var(--accent);
      text-shadow: 0 0 16px rgba(0,200,255,0.5);
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 5px;
      font-family: var(--mono);
      letter-spacing: 0.5px;
    }

    .card {
      background: rgba(10,20,28,0.85);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.04) inset;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      font-family: var(--mono);
      color: var(--accent);
    }
    .card-title::before { content: '// '; opacity: 0.5; }
    .card-sub {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 24px;
      font-family: var(--mono);
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: var(--mono);
    }
    .form-control {
      width: 100%;
      background: rgba(0,200,255,0.03);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,200,255,0.12);
    }
    .form-control::placeholder { color: var(--text3); }

    .error-box {
      background: rgba(255,71,87,0.07);
      border: 1px solid rgba(255,71,87,0.25);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--red);
      font-size: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, rgba(0,200,255,0.15), rgba(108,99,255,0.15));
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
      letter-spacing: 1.5px;
      font-family: var(--mono);
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,200,255,0.15);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, rgba(0,200,255,0.22), rgba(108,99,255,0.2));
      box-shadow: 0 0 24px rgba(0,200,255,0.3);
    }
    .btn-login:active { transform: scale(0.99); box-shadow: none; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--text3);
      font-family: var(--mono);
    }
    .hint a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .features {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .feature {
      background: rgba(0,200,255,0.02);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
    }
    .feature-icon { font-size: 18px; margin-bottom: 4px; }
    .feature-label { font-size: 11px; color: var(--text3); font-weight: 500; font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark-wrap">
        <div class="brand-mark">🤖</div>
      </div>
      <div class="brand-name">PARAKEETAI</div>
      <div class="brand-sub">// AI assistant for interviews &amp; meetings</div>
    </div>

    <div class="card">
      <div class="card-title">AUTHENTICATE</div>
      <div class="card-sub">sign in to access your sessions</div>

      {% if error %}
      <div class="error-box">
        <span>⚠</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            autofocus
            value="{{ form.data.username|default:'' }}"
          >
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login">▶ Sign In</button>
      </form>

      <div class="divider"></div>
      <div class="hint">
        Don't have an account? <a href="/signup/">Sign up</a>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎙️</div>
        <div class="feature-label">Live transcription</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-label">AI coaching</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🗺️</div>
        <div class="feature-label">Conversation blueprint</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <div class="feature-label">Private & local</div>
      </div>
    </div>
  </div>
</body>
</html>

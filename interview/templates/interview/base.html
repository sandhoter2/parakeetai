<!DOCTYPE html>
<html lang="en" data-theme="{% if request.user.is_authenticated %}{{ request.user.profile.theme|default:'dark' }}{% else %}dark{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PARAKEETAI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <script>
    (function() {
      var saved = localStorage.getItem('pkai_theme');
      var userTheme = "{% if request.user.is_authenticated %}{{ request.user.profile.theme|default:'dark' }}{% else %}dark{% endif %}";
      var active = saved || userTheme || 'dark';
      document.documentElement.setAttribute('data-theme', active);
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: rgba(0, 240, 255, 0.25);
      color: #ffffff;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    :root {
      /* ── CYBER OBSIDIAN PALETTE (DARK) ─────────────────────────── */
      --bg:        #03070c;
      --bg2:       #071018;
      --bg3:       #0e1c2a;
      --bg4:       #15293d;
      --border:    rgba(255, 255, 255, 0.08);
      --border2:   rgba(0, 240, 255, 0.22);
      --border3:   rgba(255, 255, 255, 0.14);
      --accent:    #00f0ff;
      --accent2:   #818cf8;
      --accent3:   #c084fc;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --accent-dim:  rgba(0, 240, 255, 0.09);
      --green:     #10b981;
      --red:       #f43f5e;
      --yellow:    #fbbf24;
      --blue:      #38bdf8;
      --purple:    #a855f7;
      --text:      #f8fafc;
      --text2:     #94a3b8;
      --text3:     #475569;
      --mono:      'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --sans:      'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius:    8px;
      --radius-sm: 5px;
      --radius-lg: 12px;
      --nav-h:     60px;
      --scan:      0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
      --shadow-glow: 0 0 24px var(--accent-glow);
    }

    [data-theme="light"] {
      /* ── LUXURY SLATE PALETTE (LIGHT) ────────────────────────────── */
      --bg:        #f8fafc;
      --bg2:       #ffffff;
      --bg3:       #f1f5f9;
      --bg4:       #e2e8f0;
      --border:    #e2e8f0;
      --border2:   #cbd5e1;
      --border3:   #94a3b8;
      --accent:    #0284c7;
      --accent2:   #4f46e5;
      --accent3:   #9333ea;
      --accent-glow: rgba(2, 132, 199, 0.16);
      --accent-dim:  rgba(2, 132, 199, 0.07);
      --green:     #16a34a;
      --red:       #e11d48;
      --yellow:    #d97706;
      --blue:      #2563eb;
      --purple:    #7c3aed;
      --text:      #0f172a;
      --text2:     #334155;
      --text3:     #64748b;
      --scan:      0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 36px rgba(0,0,0,0.10);
      --shadow-glow: 0 0 20px var(--accent-glow);
    }

    [data-theme="light"] ::selection {
      background: rgba(2, 132, 199, 0.2);
      color: #0f172a;
    }

    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
      background-image: radial-gradient(circle, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Ambient atmospheric glow */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background:
        radial-gradient(ellipse 55% 45% at 20% 0%, rgba(0, 240, 255, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 80% 100%, rgba(129, 140, 248, 0.05) 0%, transparent 60%);
    }

    [data-theme="light"] body {
      background-image: radial-gradient(circle, rgba(2, 132, 199, 0.045) 1px, transparent 1px);
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 55% 45% at 20% 0%, rgba(2, 132, 199, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 80% 100%, rgba(79, 70, 229, 0.04) 0%, transparent 60%);
    }

    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px,
        transparent 1px, transparent 3px
      );
      opacity: var(--scan);
    }

    [data-theme="light"] body::after {
      display: none !important;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease, opacity 0.15s ease;
    }
    a:hover {
      color: var(--accent2);
      text-decoration: none;
    }

    /* ── ENHANCED NAVBAR ─────────────────────────────────────────── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: var(--nav-h);
      background: rgba(3, 7, 12, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,0.3);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    [data-theme="light"] .navbar {
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 1px 0 var(--border), 0 4px 16px rgba(0,0,0,0.04);
    }

    .navbar-brand {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.8px;
      font-family: var(--mono);
      text-transform: uppercase;
      text-decoration: none !important;
    }
    .navbar-brand:hover {
      text-decoration: none;
    }

    .brand-mark {
      width: 34px; height: 34px; border-radius: var(--radius-sm); flex-shrink: 0;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.16) 0%, rgba(129, 140, 248, 0.16) 100%);
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 14px var(--accent-glow), inset 0 0 8px var(--accent-dim);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .navbar-brand:hover .brand-mark {
      transform: scale(1.05) rotate(-2deg);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand-text {
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    [data-theme="light"] .brand-text {
      background: linear-gradient(135deg, #0f172a 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-dim);
      border: 1px solid var(--border2);
      color: var(--accent);
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    .navbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg2);
      font-size: 12px;
      color: var(--text);
      font-family: var(--mono);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .nav-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #040b10;
      font-family: var(--mono);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      display: inline-block;
    }

    /* ── BUTTON SYSTEM ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none !important;
      font-family: var(--sans);
      letter-spacing: 0.3px;
      white-space: nowrap;
      position: relative;
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.18) 0%, rgba(129, 140, 248, 0.22) 100%);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
      font-weight: 700;
    }
    .btn-primary:hover {
      background: var(--accent);
      color: #03070c;
      box-shadow: 0 0 24px var(--accent-glow), 0 4px 16px rgba(0, 240, 255, 0.3);
      text-decoration: none;
    }
    [data-theme="light"] .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #0369a1 100%);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
    }
    [data-theme="light"] .btn-primary:hover {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    }

    .btn-secondary {
      background: var(--bg2);
      color: var(--text);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background: var(--bg3);
      border-color: var(--border2);
      color: var(--accent);
      text-decoration: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border-color: transparent;
    }
    .btn-ghost:hover {
      background: var(--bg3);
      color: var(--text);
      border-color: var(--border);
      text-decoration: none;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.08);
      color: var(--red);
      border-color: rgba(244, 63, 94, 0.25);
    }
    .btn-danger:hover {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.08);
      color: var(--green);
      border-color: rgba(16, 185, 129, 0.25);
    }
    .btn-success:hover {
      background: var(--green);
      color: #03070c;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }

    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-xs { padding: 3px 8px; font-size: 10px; border-radius: 4px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none; }

    .container { max-width: 1220px; margin: 0 auto; padding: 32px 24px; }

    /* ── CARD ELEVATIONS ─────────────────────────────────────────── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:hover {
      border-color: var(--border2);
      box-shadow: var(--shadow-md);
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2) 50%, transparent);
      opacity: 0.4;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
      /* top-left corner accent */
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 24px; height: 2px;
      background: var(--accent);
      border-radius: 0 0 2px 0;
      opacity: 0.5;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-family: var(--mono);
    }
    .badge-active { background: rgba(0,255,157,0.1); color: var(--green); border: 1px solid rgba(0,255,157,0.3); }
    .badge-pending { background: rgba(255,211,42,0.1); color: var(--yellow); border: 1px solid rgba(255,211,42,0.3); }
    .badge-ended { background: rgba(51,79,101,0.3); color: var(--text3); border: 1px solid var(--border); }

    /* Toast — robot terminal style */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 9999; pointer-events: none;
    }
    .toast {
      padding: 8px 14px 8px 10px;
      border-radius: 3px; font-size: 12px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      animation: toastIn 0.2s ease;
      pointer-events: auto; max-width: 340px;
      font-family: var(--mono);
      border-left: 3px solid transparent;
    }
    .toast::before { content: '> '; opacity: 0.5; }
    .toast-success { background: rgba(0,255,157,0.06); border-color: var(--green); color: var(--green); border-right: 1px solid rgba(0,255,157,0.2); border-top: 1px solid rgba(0,255,157,0.1); border-bottom: 1px solid rgba(0,255,157,0.1); }
    .toast-error   { background: rgba(255,71,87,0.06); border-color: var(--red); color: var(--red); border-right: 1px solid rgba(255,71,87,0.2); border-top: 1px solid rgba(255,71,87,0.1); border-bottom: 1px solid rgba(255,71,87,0.1); }
    .toast-info    { background: rgba(0,200,255,0.06); border-color: var(--accent); color: var(--accent); border-right: 1px solid rgba(0,200,255,0.2); border-top: 1px solid rgba(0,200,255,0.1); border-bottom: 1px solid rgba(0,200,255,0.1); }
    .toast-warn    { background: rgba(255,211,42,0.06); border-color: var(--yellow); color: var(--yellow); border-right: 1px solid rgba(255,211,42,0.2); border-top: 1px solid rgba(255,211,42,0.1); border-bottom: 1px solid rgba(255,211,42,0.1); }
    @keyframes toastIn { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:translateX(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateX(12px)} }

    /* Modal — robot terminal style */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 28px; max-width: 520px; width: 90%;
      transform: scale(0.96) translateY(-6px); transition: transform 0.2s;
      box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.06);
      position: relative; overflow: hidden;
    }
    .modal::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-title {
      font-size: 14px; font-weight: 700; margin-bottom: 20px;
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent);
    }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* Form utils */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 10px; font-weight: 600; color: var(--text3);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.8px;
      font-family: var(--mono);
    }
    .form-control {
      width: 100%; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 4px; padding: 9px 13px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    textarea.form-control { resize: vertical; min-height: 90px; }
    select.form-control option { background: var(--bg3); }
    .form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="brand-mark">🤖</div>
      <span class="brand-text">PARAKEET<span style="color:var(--accent);font-size:12px;vertical-align:super;margin-left:1px">AI</span></span>
      <span class="brand-badge">COPILOT</span>
    </a>
    <div class="navbar-actions">
      <button id="themeToggleBtn" type="button" class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="Toggle Theme" style="padding:6px 10px;font-size:14px;border:1px solid var(--border)">🌓</button>
      {% block navbar_actions %}
      {% if user.is_authenticated %}
      <a href="/templates/" class="btn btn-ghost btn-sm">🗂 Templates</a>
      <a href="/profile/" class="btn btn-ghost btn-sm">Profile</a>
      <a href="/settings/" class="btn btn-ghost btn-sm">Settings</a>
      <a href="/session/new/" class="btn btn-primary btn-sm">+ New Session</a>
      <div class="nav-user-badge">
        <div class="nav-avatar">{{ user.username|first|upper }}</div>
        <span class="status-dot"></span>
        <span>{{ user.username }}</span>
      </div>
      <form method="post" action="/logout/" style="display:inline;margin:0">
        {% csrf_token %}
        <button type="submit" class="btn btn-ghost btn-sm" style="color:var(--red)">Sign Out</button>
      </form>
      {% else %}
      <a href="/login/" class="btn btn-primary btn-sm">Sign In</a>
      {% endif %}
      {% endblock %}
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div id="toast-container"></div>

  <script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('pkai_theme', next);

    const select = document.getElementById('themeSelect');
    if (select) select.value = next;
    const radios = document.querySelectorAll('input[name="theme"]');
    radios.forEach(r => { if (r.value === next) r.checked = true; });

    const csrf = getCookie('csrftoken');
    if (csrf) {
      fetch('/api/theme/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrf
        },
        body: JSON.stringify({ theme: next })
      }).catch(function() {});
    }
    toast(next === 'light' ? 'Light mode enabled' : 'Dark mode enabled', 'info', 2000);
  }

  function toast(msg, type='info', duration=3000) {
    const icons = {success:'✓', error:'✗', info:'ℹ', warn:'⚠'};
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => {
      el.style.animation = 'toastOut 0.25s ease forwards';
      setTimeout(() => el.remove(), 250);
    }, duration);
  }

  function copyText(text, label) {
    navigator.clipboard.writeText(text).then(() => toast((label||'Copied') + ' to clipboard', 'success'));
  }

  function getCookie(name) {
    const v = `; ${document.cookie}`;
    const p = v.split(`; ${name}=`);
    if (p.length === 2) return p.pop().split(';').shift();
    return '';
  }

  function openModal(id) {
    document.getElementById(id).classList.add('open');
    document.getElementById(id).querySelector('input,textarea')?.focus();
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  });
  </script>
</body>
</html>
